name: Build APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find project (unpack GoJava.zip if present)
        run: |
          if [ -f GoJava.zip ]; then unzip -q -o GoJava.zip -d _p; fi
          S=$(find . -name settings.gradle -not -path "./.git/*" | head -1)
          echo "ROOT=$(dirname "$S")" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Build debug APK
        working-directory: ${{ env.ROOT }}
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: ${{ env.ROOT }}/app/build/outputs/apk/debug/app-debug.apk
